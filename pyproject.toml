[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rossmann-forecast"
version = "0.2.0"
description = "Rolling-origin evaluation of 6-week store-level sales forecasts on the Rossmann Kaggle data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "prophet>=1.1",
    "shap>=0.45",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rossmann = "rossmann_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: end-to-end synthetic pipeline run"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # long report-text f-strings; the formatter handles code
